# Builds the container image and publishes it to the GitHub Container Registry.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# publishes ghcr.io/jmatthiesen81/office-attendance-bot with the tags 1.0.0,
# 1.0, 1 and latest (pre-releases such as v1.1.0-rc.1 only get their own tag).
# Every push to a version branch (1.0, 1.1, 2.0, …) publishes the untested
# state as edge and sha-<commit>, e.g. for a test server. Pull requests only
# run the tests and a test build.
name: release

on:
  push:
    # Version branches such as 1.0 (quoted: unquoted 1.0 would be a number).
    branches: ["[0-9]+.[0-9]+"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Release tags report their version (1.2.3), branch builds edge-<commit>.
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=edge-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # Pushes (release tags and version branches) publish, pull requests don't.
      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=edge,enable=${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}
            type=sha,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=office-attendance-bot
            org.opencontainers.image.description=Slack bot for a weekly poll of office days

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
