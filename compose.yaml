services:
  officebot:
    # Published image (major version 1, gets fixes and features but no breaking
    # changes). Every `docker compose up -d` pulls the newest one; `--build`
    # builds from source instead, which also happens if the pull fails.
    image: ghcr.io/jmatthiesen81/office-attendance-bot:1
    pull_policy: always
    build: .
    container_name: officebot
    # Shared defaults (committed), then local settings and secrets (ignored by git).
    env_file:
      - path: .env
        required: true
      - path: .env.local
        required: false
    # Run as the host user so the bind-mounted data directory stays owned by you.
    user: "${OFFICEBOT_UID:-1000}:${OFFICEBOT_GID:-1000}"
    restart: unless-stopped
    # SIGTERM → graceful shutdown (in-flight saves and jobs finish first)
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # All data lives visibly in the project directory, no Docker volumes.
      - ./volumes/officebot:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/officebot", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    # Web interface (ADR 0003, WEB_LISTEN_ADDR=:8080): reachable only within
    # the Compose network, i.e. through Caddy or another reverse proxy.
    expose:
      - "8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional reverse proxy with TLS for the web interface (ADR 0003, section 9).
  # Starts only with the profile: docker compose --profile web up -d
  caddy:
    image: caddy:2
    container_name: officebot-caddy
    profiles: ["web"]
    restart: unless-stopped
    depends_on:
      - officebot
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
      - "${PROXY_HTTPS_PORT:-443}:443/udp"
    environment:
      OFFICEBOT_DOMAIN: ${OFFICEBOT_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
      CADDY_TLS: ${CADDY_TLS:-auto}
      # {$$VAR} is Caddy's own environment placeholder ($$ keeps Compose from
      # substituting it).
      # auto: automatic Let's Encrypt certificate. Ports 80 or 443 must be
      # reachable from the internet (HTTP-01 or TLS-ALPN-01). ADR 0003, section 9.
      CADDYFILE_auto: |
        {
        	email {$$ACME_EMAIL}
        }

        {$$OFFICEBOT_DOMAIN} {
        	reverse_proxy officebot:8080
        }
      # files: certificate issued elsewhere, e.g. via DNS-01 for other ports,
      # internal-only access or wildcards. The issuing service writes
      # fullchain.pem and privkey.pem to CADDY_CERT_DIR and reloads Caddy
      # after every renewal (command above).
      CADDYFILE_files: |
        {$$OFFICEBOT_DOMAIN} {
        	tls /certs/fullchain.pem /certs/privkey.pem
        	reverse_proxy officebot:8080
        }
    # The Caddyfiles live in compose.yaml itself (CADDYFILE_* above), so a
    # server needs no clone of the repository. At start, the one selected by
    # CADDY_TLS is written to /tmp/Caddyfile (tmpfs, the container stays
    # read-only). Reload: docker exec officebot-caddy caddy reload --config /tmp/Caddyfile --force
    entrypoint: ["/bin/sh", "-c"]
    # Without ACME_EMAIL, the email line is left out (it is optional).
    # OFFICEBOT_DOMAIN, ACME_EMAIL and CADDY_TLS are substituted by Compose,
    # so they must be in .env (or the shell), not in .env.local.
    command:
      - |
        [ -n "$$OFFICEBOT_DOMAIN" ] || { echo "OFFICEBOT_DOMAIN is empty: set it in .env (Compose does not read .env.local for this)" >&2; exit 1; }
        case "$$CADDY_TLS" in auto|files) ;; *) echo "CADDY_TLS must be auto or files" >&2; exit 1;; esac
        printenv "CADDYFILE_$$CADDY_TLS" | if [ -n "$$ACME_EMAIL" ]; then cat; else grep -vF '{$$ACME_EMAIL}'; fi > /tmp/Caddyfile
        exec caddy run --config /tmp/Caddyfile --adapter caddyfile
    volumes:
      # Certificates of the auto mode live here and must be kept.
      - ./volumes/caddy/data:/data
      - ./volumes/caddy/config:/config
      # Certificate and key of the files mode (written by an external service).
      - ${CADDY_CERT_DIR:-./volumes/certs}:/certs:ro
    read_only: true
    tmpfs:
      - /tmp
    # Caddy runs as root inside the container to bind 80/443, with every
    # capability dropped except that one.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

