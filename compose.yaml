services:
  officebot:
    # Published image (major version 1, gets fixes and features but no breaking
    # changes). Every `docker compose up -d` pulls the newest one; `--build`
    # builds from source instead, which also happens if the pull fails.
    image: ghcr.io/jmatthiesen81/office-attendance-bot:1
    pull_policy: always
    build: .
    container_name: officebot
    # Shared defaults (committed), then local settings and secrets (ignored by git).
    env_file:
      - path: .env
        required: true
      - path: .env.local
        required: false
    # Run as the host user so the bind-mounted data directory stays owned by you.
    user: "${OFFICEBOT_UID:-1000}:${OFFICEBOT_GID:-1000}"
    restart: unless-stopped
    # SIGTERM → graceful shutdown (in-flight saves and jobs finish first)
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # All data lives visibly in the project directory, no Docker volumes.
      - ./volumes/officebot:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/officebot", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    # Web interface (ADR 0003, WEB_LISTEN_ADDR=:8080): reachable only within
    # the Compose network, i.e. through Caddy or another reverse proxy.
    expose:
      - "8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional reverse proxy with TLS for the web interface (ADR 0003, section 9).
  # Starts only with the profile: docker compose --profile web up -d
  caddy:
    image: caddy:2
    container_name: officebot-caddy
    profiles: ["web"]
    restart: unless-stopped
    depends_on:
      - officebot
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
      - "${PROXY_HTTPS_PORT:-443}:443/udp"
    environment:
      OFFICEBOT_DOMAIN: ${OFFICEBOT_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      # auto (default) or files, see deploy/caddy/
      - ./deploy/caddy/Caddyfile.${CADDY_TLS:-auto}:/etc/caddy/Caddyfile:ro
      # Certificates of the auto mode live here and must be kept.
      - ./volumes/caddy/data:/data
      - ./volumes/caddy/config:/config
      # Certificate and key of the files mode (written by an external service).
      - ${CADDY_CERT_DIR:-./volumes/certs}:/certs:ro
    read_only: true
    tmpfs:
      - /tmp
    # Caddy runs as root inside the container to bind 80/443, with every
    # capability dropped except that one.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
